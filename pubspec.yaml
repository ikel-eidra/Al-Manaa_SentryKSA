name: sentry_ksa
description: "SentryKSA - Strategic Risk Monitoring for Saudi Arabia"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Maps & Location
  google_maps_flutter: ^2.5.3
  google_maps_flutter_web: ^0.5.7
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Networking
  http: ^1.2.0
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Charts
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  google_fonts: ^6.1.0

  # Notifications
  flutter_local_notifications: ^17.0.0
  audioplayers: ^5.2.1

  # Crypto (provenance hashing)
  crypto: ^3.0.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
